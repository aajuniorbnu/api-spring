spring.application.name=api-spring
#PostgreSQL
#cada chave le a variavel de ambiente e o cado nao existir , usa o valor padrao

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/helpdesk}
spring.datasource.username=${DATABSE_USER:postgres}
spring.datasource.password=${DATABASE_PASSWORD:admin}
spring.datasource.driver-class-name=org.postgresql.Driver

#JPA
#update:o hibernate cria/altera as tabelas
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show_sql=true
spring,jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

#SWAGGER(springdocs
#http://localhost:8080/docs
springdoc.swagger-ui.path=/docs
springdoc.swagger.ui.operantions-sorter=method