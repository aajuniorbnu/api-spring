<section class="cartao"><div class="cabecalho-pagina"><h1>{{ id === null ? 'Cadastrar' : 'Editar' }} chamado</h1><a class="voltar" routerLink="/chamados/listar">Voltar</a></div>
@if (erro()) { <p class="aviso erro" role="alert">{{ erro() }}</p> }
@if (carregando()) { <p role="status">Carregando…</p> }
<form #cadastro="ngForm" (ngSubmit)="salvar()"><fieldset [disabled]="salvando() || carregando() || indisponivel()"><div class="campo"><label for="titulo">Título</label><input id="titulo" name="titulo" [(ngModel)]="form.titulo" required minlength="2" maxlength="100"></div>
<div class="campo"><label for="descricao">Descrição</label><textarea id="descricao" name="descricao" [(ngModel)]="form.descricao" required maxlength="2000" rows="4"></textarea></div><div class="campo"><label for="prioridade">Prioridade</label><select id="prioridade" name="prioridade" [(ngModel)]="form.prioridade" required><option value="BAIXA">BAIXA</option><option value="MEDIA">MEDIA</option><option value="ALTA">ALTA</option><option value="URGENTE">URGENTE</option></select></div>
<div class="campo"><label for="status">Status</label><select id="status" name="status" [(ngModel)]="form.status" required><option value="ABERTO">ABERTO</option><option value="EM_ANDAMENTO">EM ANDAMENTO</option><option value="RESOLVIDO">RESOLVIDO</option><option value="FECHADO">FECHADO</option></select></div>
<div class="campo"><label for="prazo">Prazo</label><input id="prazo" name="prazo" [(ngModel)]="form.prazo" required type="date"></div>
<div class="campo"><label for="categoriaId">Categoria</label><select id="categoriaId" name="categoriaId" [(ngModel)]="form.categoriaId" required><option [ngValue]="null">Selecione</option>@for (item of categorias(); track item.id) { <option [ngValue]="item.id">{{ item.nome }}{{ item.ativa ? "" : " (inativa)" }}</option> }</select></div>
<div class="campo"><label for="solicitanteId">Solicitante</label><select id="solicitanteId" name="solicitanteId" [(ngModel)]="form.solicitanteId" required><option [ngValue]="null">Selecione</option>@for (item of usuarios(); track item.id) { <option [ngValue]="item.id">{{ item.nome }}{{ item.ativo ? "" : " (inativo)" }}</option> }</select></div>
<p><a routerLink="/categorias/cadastrar">Cadastrar categoria</a> · <a routerLink="/usuarios/cadastrar">Cadastrar usuário</a></p><button class="btn btn-primario" type="submit" [disabled]="cadastro.invalid || salvando()">{{ salvando() ? 'Salvando…' : 'Salvar' }}</button></fieldset></form></section>
