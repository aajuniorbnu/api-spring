<section class="cartao"><div class="cabecalho-pagina"><h1>Cadastrar ticket</h1><a class="voltar" routerLink="/tickets/listar">Voltar</a></div>
@if (erro()) { <p class="aviso erro" role="alert">{{ erro() }}</p> }
@if (carregando()) { <p role="status">Carregando…</p> }
<form #cadastro="ngForm" (ngSubmit)="salvar()"><fieldset [disabled]="salvando() || carregando() || indisponivel()"><div class="campo"><label for="titulo">Título</label><input id="titulo" name="titulo" [(ngModel)]="form.titulo" required minlength="5" maxlength="120"></div>
<div class="campo"><label for="descricao">Descrição</label><textarea id="descricao" name="descricao" [(ngModel)]="form.descricao" required minlength="10" maxlength="5000" rows="4"></textarea></div><div class="campo"><label for="setor">Setor</label><select id="setor" name="setor" [(ngModel)]="form.setor" required><option value="TI">TI</option><option value="RH">RH</option><option value="FINANCEIRO">FINANCEIRO</option><option value="ADMINSTRACAO">ADMINISTRAÇÃO</option><option value="MANUTENCAO">MANUTENÇÃO</option></select></div>
<div class="campo"><label for="solicitante_id">Solicitante</label><select id="solicitante_id" name="solicitante_id" [(ngModel)]="form.solicitante_id" required><option [ngValue]="null">Selecione</option>@for (item of usuarios(); track item.id) { <option [ngValue]="item.id">{{ item.nome }}</option> }</select></div>
<p><a routerLink="/usuarios/cadastrar">Cadastrar solicitante</a></p><button class="btn btn-primario" type="submit" [disabled]="cadastro.invalid || salvando()">{{ salvando() ? 'Salvando…' : 'Salvar' }}</button></fieldset></form></section>
