<div class="cartao">
  <div class="cabecalho-pagina">
    <h1>Cadastrar categoria</h1>
    <a routerLink="/categorias/listar" class="voltar">Voltar</a>
  </div>
  @if (erro()) { <p class="aviso erro" role="alert">{{ erro() }}</p> }
  @if (mensagem()) { <p class="aviso sucesso" role="status">{{ mensagem() }}</p> }
  <form #formulario="ngForm" (ngSubmit)="cadastrar()">
    <div class="campo">
      <label for="nome">Nome</label>
      <input id="nome" name="nome" [(ngModel)]="form.nome" #nome="ngModel"
        required minlength="2" maxlength="60" [disabled]="salvando()" aria-describedby="ajuda-nome" />
      <small id="ajuda-nome">Obrigatório, de 2 a 60 caracteres.</small>
      @if (nome.invalid && nome.touched) { <p class="erro" role="alert">Confira o nome informado.</p> }
    </div>
    <div class="campo">
      <label for="descricao">Descrição</label>
      <textarea id="descricao" name="descricao" [(ngModel)]="form.descricao" rows="4"
        maxlength="255" [disabled]="salvando()" aria-describedby="ajuda-descricao"></textarea>
      <small id="ajuda-descricao">Opcional, até 255 caracteres.</small>
    </div>
    <div class="acoes">
      <button type="submit" class="btn btn-primario" [disabled]="formulario.invalid || salvando()">
        {{ salvando() ? 'Salvando...' : 'Cadastrar' }}
      </button>
    </div>
  </form>
</div>
